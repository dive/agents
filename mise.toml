[tools]
"github:agent-ecosystem/skill-validator" = "1.6.0"
github-cli = "latest"
node = "lts"
pi = "latest"

[dotfiles]
"~/.codex/AGENTS.md" = "global/AGENTS.md"
"~/.claude/CLAUDE.md" = "global/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "global/AGENTS.md"
"~/.pi/agent/APPEND_SYSTEM.md" = "global/AGENTS.md"
"~/.config/amp/AGENTS.md" = "global/AGENTS.md"
"~/.config/amp/plugins/caffeinate.ts" = "amp-plugins/caffeinate.ts"
"~/.agents/skills/gh-stack" = "skills/gh-stack"
"~/.agents/skills/obsidian-cli" = "skills/obsidian-cli"
"~/.agents/skills/sentry-cli" = "skills/sentry-cli"
"~/.pi/agent/prompts/review.md" = "destroot/pi/agent/prompts/review.md"

[tasks.skills-health]
description = "Validate repo Agent Skills"
run = """
#!/usr/bin/env bash
set +e
skill-validator validate structure --allow-extra-frontmatter skills
status=$?
if [ "$status" -eq 2 ]; then
  exit 0
fi
exit "$status"
"""

[tasks.skills-updates-check]
description = "Preview gh skill updates for GitHub-sourced skills"
run = """
skills="$(for f in skills/*/SKILL.md; do
  name="$(basename "$(dirname "$f")")"
  if grep -q 'github-repo:' "$f" && [ "$name" != sentry-cli ]; then
    echo "$name"
  fi
done)"
if [ -n "$skills" ]; then
  gh skill update --dir skills --dry-run $skills
fi

local_sha="$(sed -n 's/^    github-tree-sha: //p' skills/sentry-cli/SKILL.md)"
remote_sha="$(gh api 'repos/getsentry/cli/git/trees/main?recursive=1' --jq '.tree[] | select(.path == "packages/cli/plugins/sentry-cli/skills/sentry-cli") | .sha')"
if [ "$local_sha" = "$remote_sha" ]; then
  echo "✓ sentry-cli is up to date ($local_sha)"
else
  echo "! sentry-cli update available: $local_sha -> $remote_sha"
fi
"""

[tasks.skills-update]
description = "Update GitHub-sourced Agent Skills in ./skills"
run = """
skills="$(for f in skills/*/SKILL.md; do
  name="$(basename "$(dirname "$f")")"
  if grep -q 'github-repo:' "$f" && [ "$name" != sentry-cli ]; then
    echo "$name"
  fi
done)"
if [ -n "$skills" ]; then
  gh skill update --dir skills --all $skills
fi
mise run skills-sentry-refresh
mise run skills-health
"""

[tasks.skills-sentry-refresh]
description = "Refresh the Sentry CLI skill from its exact path on main"
run = '''
gh skill install getsentry/cli 'packages/cli/plugins/sentry-cli/skills/sentry-cli@main' --dir skills --force
node <<'NODE'
const fs = require('node:fs')
const path = 'skills/sentry-cli/SKILL.md'
const source = fs.readFileSync(path, 'utf8')
const staleLink = '\n\nSee [Exit Codes](/exit-codes/) for the complete reference.\n\n'
const patched = source.replace(staleLink, '\n\n')
if (patched !== source) fs.writeFileSync(path, patched)
NODE
'''

[tasks.pi-extensions-list]
description = "List installed pi extensions"
run = "pi list"

[tasks.pi-extensions-validate]
description = "Typecheck and smoke-load extensions against the latest Pi release"
dir = "pi-extensions"
run = "npm run validate:latest"

[tasks.pi-extensions-install]
description = "Install all pi-extensions in global pi settings"
run = "pi install ./pi-extensions"

[tasks.pi-extensions-install-local]
description = "Install all pi-extensions in project .pi/settings.json"
run = "pi install -l ./pi-extensions"

[tasks.pi-extensions-uninstall]
description = "Uninstall all pi-extensions from global pi settings"
run = "pi remove ./pi-extensions"

[tasks.pi-extensions-uninstall-local]
description = "Uninstall all pi-extensions from project .pi/settings.json"
run = "pi remove -l ./pi-extensions"

[tasks.bootstrap]
description = "Install repo-managed pi extensions after tools and dotfiles"
depends = ["pi-extensions-install"]
